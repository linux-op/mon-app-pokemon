name: Scraping Quotidien

on:
  schedule:
    - cron: '0 3 * * *'   # S'exécute à 3h00 UTC tous les jours
  workflow_dispatch:       # Permet de le lancer manuellement via un bouton

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les données existantes (branche data)
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch data "$URL" data
          else
            mkdir -p data
          fi

      - name: Lancer le script Python
        run: python fetch_prices.py --out data

      - name: Sauvegarder les résultats sur GitHub
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Mise à jour quotidienne $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin data