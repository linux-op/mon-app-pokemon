name: Scraping Quotidien

on:
  schedule:
    - cron: '0 3 * * *' # S'exécute à 3h00 tous les jours
  workflow_dispatch:    # Ajoute un bouton pour le lancer manuellement

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: python update_prix.py
      - run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add historique_prix.csv
          git commit -m "Mise à jour quotidienne" || echo "Rien à mettre à jour"
          git push
